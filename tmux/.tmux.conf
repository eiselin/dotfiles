set -g extended-keys on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g base-index 1          # window numbering starts at 1
set -g pane-base-index 1     # pane numbering starts at 1

# Catppuccin (official port, catppuccin/tmux) — Frappé (dark) or Latte
# (light) based on macOS appearance; the theme-watcher LaunchAgent reloads
# this file live.
#
# The plugin sets its options with `set -o` (no-overwrite), so re-sourcing
# this file after a dark/light switch would keep the OLD flavor's colors.
# Unset every option the plugin owns first. if-shell runs its condition
# synchronously; the branches are empty, we only want the side effect.
if-shell "tmux show-options -g | cut -d' ' -f1 | grep -E '^@(catppuccin|thm)' | xargs -n1 tmux set -Ugq" "" ""

if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
  "set -g @catppuccin_flavor 'frappe'" \
  "set -g @catppuccin_flavor 'latte'"
# Window name (#W) in the tabs instead of pane-title (#T), so that
# rename-window is directly visible in the status bar.
# (documented options of the catppuccin/tmux port)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status bar background: solid Catppuccin "bg" — the same color Ghostty
# paints behind everything (theme bg, with opacity/blur applied uniformly),
# so this looks identical to "none"/transparent. It must be a solid color so
# the rounded window separators can blend into the bar (with "none" they get
# fg=default and show up as black/white half-circle artifacts).
set -g @catppuccin_status_background "#{@thm_bg}"

# Themed window entries: rounded segments + Nerd Font flags (zoom, bell, …)
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Keep selected text readable: the plugin only sets a background and
# leaves the original text color in place, making light text unreadable
# on a light selection. Explicit combination with sufficient contrast
# per flavor.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
  'set -gF mode-style "bg=#51576d,fg=#c6d0f5"' \
  'set -gF mode-style "bg=#bcc0cc,fg=#4c4f69"'

# Status line: assemble from catppuccin modules (must come after the plugin's
# `run` line above; icons are Nerd Font glyphs, so they need a Nerd Font).
set -g status-left-length 60
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
